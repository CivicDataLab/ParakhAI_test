name: Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    # Every input is optional with a default so existing callers that pass only
    # `secrets:` (and the standalone push/dispatch triggers, where the `inputs`
    # context is empty) keep working unchanged.
    inputs:
      marker_expr:
        description: "pytest -m expression selecting which tests to run."
        type: string
        required: false
        default: smoke
      base_url:
        description: "Frontend base URL. Falls back to vars.BASE_URL, then the dev default."
        type: string
        required: false
        default: ""
      graphql_url:
        description: "Backend GraphQL endpoint. Falls back to vars.GRAPHQL_URL, then the dev default."
        type: string
        required: false
        default: ""
      install_browsers:
        description: "Install Playwright browsers. Set false for browserless (API-only) runs."
        type: boolean
        required: false
        default: true
      min_passed:
        description: "Fail the job if fewer than this many tests passed."
        type: number
        required: false
        default: 1
      deployed_sha:
        description: "Commit SHA the backend is expected to report. Empty disables the check."
        type: string
        required: false
        default: ""
    secrets:
      TEST_EMAIL_1:
        required: false
      TEST_PASSWORD_1:
        required: false
      TEST_EMAIL_2:
        required: false
      TEST_PASSWORD_2:
        required: false
      SANDBOX_ORG_SLUG:
        required: false

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://dev.parakh.civicdataspace.in' }}
      GRAPHQL_URL: ${{ inputs.graphql_url || vars.GRAPHQL_URL || 'https://dev.api.parakh.civicdataspace.in/graphql/' }}
      ENVIRONMENT: development
      BROWSER: chromium
      HEADLESS: "true"
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}
      TEST_USER_INDEX: "1"
      SANDBOX_ORG_SLUG: ${{ secrets.SANDBOX_ORG_SLUG }}
      PYTHON_VERSION: "3.11"
      # `inputs` is empty on the push/dispatch triggers, so every input needs an
      # explicit fallback here — `pytest -m ""` would otherwise collect the
      # entire 800-test suite instead of the smoke subset.
      MARKER_EXPR: ${{ inputs.marker_expr || 'smoke' }}
      MIN_PASSED: ${{ inputs.min_passed || 1 }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      # nginx rejects curl's default User-Agent with a 403, so the probes below
      # must send their own.
      PROBE_UA: ParakhSmokeGate/1.0

    steps:
      - uses: actions/checkout@v6
        with:
          repository: CivicDataLab/ParakhAI_test
          ref: main

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        # `format()` distinguishes an explicit `false` from an absent input:
        # a null input renders as '' and still installs, so push/dispatch runs
        # (which have no `inputs` context) keep their browsers.
        if: ${{ format('{0}', inputs.install_browsers) != 'false' }}
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          pytest -m "$MARKER_EXPR" \
            -v \
            --tb=short \
            --html=reports/smoke_report.html \
            --self-contained-html

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-report
          path: reports/smoke_report.html
          retention-days: 30
