name: Parakh Test Suite — CI

on:
  push:
    branches: [dev, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run every suite, bypassing path-based filtering"
        type: boolean
        required: false
        default: false

# One run at a time per PR (or per branch/ref for push/workflow_dispatch).
# Added 2026-08-12: rapid pushes to an open PR were each auto-triggering a
# full run, and because this workflow shares one dev backend across every
# run (not just within a run), overlapping runs contended with each other -
# api-tests took 42m26s against a 6m31s baseline while two runs overlapped
# (see docs/ci_workflow_notes.md). cancel-in-progress means a new push
# supersedes the old run's results immediately rather than letting a stale
# commit's run keep consuming the shared backend.
#
# Verified live 2026-08-12 that `if: always()` on a job ignores workflow
# cancellation and lets it start anyway even after the run is marked
# cancelled: api-tests correctly cancelled, but accessibility-tests (then
# `if: always()`) started right after and kept running against the shared
# backend regardless. Removed always() from the actual test jobs
# (accessibility-tests, visual-tests) so they respect cancellation via
# default success()-gating. test-summary still needs always() (it must
# tolerate e2e-tests' deliberate skip while paused) - paired with
# !cancelled() there instead of removing it outright.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ── Platform URLs (configure as repo variables: Settings → Variables → Actions) ──
  # Default targets the dev environment; override via vars.BASE_URL /
  # vars.GRAPHQL_URL / vars.ENVIRONMENT to point at staging or prod.
  BASE_URL: ${{ vars.BASE_URL || 'https://dev.parakh.civicdataspace.in' }}
  GRAPHQL_URL: ${{ vars.GRAPHQL_URL || 'https://dev.api.parakh.civicdataspace.in/graphql/' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'development' }}
  BROWSER: chromium
  HEADLESS: "true"
  SLOW_MO: "0"
  VIEWPORT_WIDTH: "1440"
  VIEWPORT_HEIGHT: "900"
  SCREENSHOT_ON_FAILURE: "true"
  VISUAL_THRESHOLD: "0.2"
  PYTHON_VERSION: "3.11"
  # ── Auth secrets (add these in GitHub → Settings → Secrets → Actions) ────────
  # Tests using the `authenticated_page` fixture skip gracefully when unset.
  # Set TEST_USER_INDEX=2 in the second parallel job to use a separate account.
  TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
  TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
  TEST_EMAIL_2: ${{ secrets.TEST_EMAIL_2 }}
  TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}
  TEST_USER_INDEX: "1"
  # Repo Variable, not a Secret (2026-08-14): its value ("1", CivicDataLab's
  # org id) isn't sensitive, and GitHub was masking every digit "1" in the job
  # summary numbers because it exactly matched this secret's value — moving
  # it here stops that without touching the actual secret, which is left in
  # place for run-smoke.yml/scheduled.yml (unrelated blast radius: run-smoke
  # is the reusable workflow ParakhAI-frontend's CD pipeline calls, not worth
  # touching for a cosmetic fix scoped to this file's own job summary).
  SANDBOX_ORG_SLUG: ${{ vars.SANDBOX_ORG_SLUG }}

jobs:
  # ────────────────────────────────────────────── Change detection
  # Added 2026-08-14 so a PR/push only runs the suites whose test code (or
  # its actual dependencies) changed — a docs-only change now runs lint and
  # nothing else, instead of the full ~25min chain every time.
  #
  # Every gated job below reads this job's outputs through its own `if:`.
  # Two failure modes both have to make downstream jobs run, not skip:
  #   1. This job is deliberately skipped (workflow_dispatch run_all=true) —
  #      handled by the `if:` below, which skips this job entirely so
  #      `needs.changes.result` becomes 'skipped'.
  #   2. This action errors outright (e.g. dorny/paths-filter itself breaks)
  #      — `needs.changes.result` becomes 'failure'.
  # Every gated job's condition is `needs.changes.result != 'success' ||
  # needs.changes.outputs.<category> == 'true'` — in both failure modes above
  # the left side is true, so every suite runs (fail OPEN, not closed). A
  # broken filter should never silently make every future PR pass CI having
  # run zero tests.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event.inputs.run_all != 'true'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      accessibility: ${{ steps.filter.outputs.accessibility }}
      visual: ${{ steps.filter.outputs.visual }}
      performance: ${{ steps.filter.outputs.performance }}
      load: ${{ steps.filter.outputs.load }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter changed paths by test category
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # workflow_dispatch has no natural "changed since what" — diff
          # against main so a manual run without run_all still filters
          # sensibly instead of erroring.
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          # Each category repeats a shared "universal" block of files whose
          # fixtures/imports every suite's test collection depends on
          # (verified via grep, not guessed) rather than using YAML anchors
          # to de-duplicate it — this is the first path-filtering this repo
          # has had; a second layer of YAML-anchor indirection on top of an
          # already-new pattern isn't worth the maintenance cost it adds.
          filters: |
            api:
              - 'tests/api/**'
              - 'tests/data/**'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'
            accessibility:
              - 'tests/accessibility/**'
              - 'utils/reporters.py'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'
            visual:
              - 'tests/visual/**'
              - 'pages/evaluator_role_page.py'
              - 'pages/new_evaluation_page.py'
              - 'locators/evaluations_locators.py'
              - 'locators/evaluator_role_locators.py'
              - 'utils/visual_guards.py'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'
            performance:
              - 'tests/performance/**'
              - 'pages/dashboard_page.py'
              - 'pages/new_evaluation_page.py'
              - 'utils/reporters.py'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'
            load:
              - 'tests/load/**'
              - 'tests/data/**'
              - 'pages/evaluations_page.py'
              - 'pages/new_evaluation_page.py'
              - 'locators/evaluations_locators.py'
              - 'utils/reporters.py'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'
            e2e:
              - 'tests/e2e/**'
              - 'tests/data/**'
              - 'pages/**'
              - 'locators/add_model_flow_locators.py'
              - 'locators/dashboard_locators.py'
              - 'locators/evaluation_detail_locators.py'
              - 'locators/evaluations_locators.py'
              - 'locators/evaluator_role_locators.py'
              - 'locators/evaluators_locators.py'
              - 'locators/models_locators.py'
              - 'locators/prompt_libraries_locators.py'
              - 'utils/test_data_factory.py'
              - 'conftest.py'
              - 'tests/conftest.py'
              - 'utils/config.py'
              - 'utils/helpers.py'
              - 'utils/report_generator.py'
              - 'pages/base_page.py'
              - 'pages/home_page.py'
              - 'pages/login_page.py'
              - 'locators/home_locators.py'
              - 'locators/login_locators.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'requirements.txt'

  # ────────────────────────────────────────────── Lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check locators/ pages/ utils/ tests/ --output-format=github

  # ────────────────────────────────────────────── API tests
  # Most tests hit the GraphQL/REST layer directly, but auth-token
  # acquisition (scripts/_api_client.get_access_token) and a few
  # cookie-security tests drive a real headless Chromium via Playwright.
  #
  # api-tests / accessibility-tests / visual-tests / e2e-tests run in a
  # serial chain (via `needs:`) rather than all firing at once after lint.
  # They all hit the same shared dev backend (dev.parakh.civicdataspace.in),
  # which has known slow-query issues (docs/app_bugs.md #13/#14) — running
  # them concurrently was overwhelming it and producing widespread transient
  # ReadTimeouts / stuck "Loading..." states that looked like test failures
  # but were pure infra flakiness (confirmed by re-running the same failures
  # in isolation, where they passed cleanly). Lighter/faster suites go first
  # so e2e-tests (the heaviest, most concurrency-sensitive suite) gets the
  # backend to itself. This trades total pipeline wall-clock time for
  # reliability.
  #
  # TRIED 2026-08-12: made api-tests + accessibility-tests concurrent (both
  # `needs: lint`) on the theory that #13/#14 being independently re-verified
  # fixed that same day, plus the backend's runserver -> Docker migration,
  # meant the underlying capacity problem was gone. It wasn't (or isn't
  # fully) — the concurrent run started failing in CI within ~13 minutes and
  # was reverted same-day. Re-attempt only with a real repro of what failed
  # (job logs from a completed run, not a cancelled one) in hand first.
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [lint, changes]
    # Path-filtered 2026-08-14 — see the `changes` job's header comment for
    # the fail-open contract. `always() && !cancelled()` (not bare always())
    # is required so this job is still *evaluated* when path-filtered suites
    # ahead of it in the chain get skipped, while still respecting a real
    # concurrency-group cancellation — the same proven-safe pairing already
    # used on test-summary; bare always() was proven unsafe here 2026-08-12.
    if: |
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.api == 'true')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run API tests
        continue-on-error: true
        run: |
          pytest tests/api/ \
            -v \
            --tb=short \
            --html=reports/api_report.html \
            --self-contained-html \
            --json-report-file=reports/api.json \
            -m api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: |
            reports/api_report.html
            reports/api.json
          retention-days: 30

  # ────────────────────────────────────────────── E2E tests (3-shard matrix)
  # Runs last in the chain (needs: visual-tests) so it has the shared dev
  # backend uncontested — see the note above api-tests for why. The 3 shards
  # still run in parallel with each other via the matrix; only the four
  # top-level suites are serialized relative to one another.
  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: visual-tests
    # PAUSED 2026-08-11 — remove this line to resume. test-summary's
    # E2E-report steps are guarded on `needs.e2e-tests.result != 'skipped'`
    # and degrade cleanly while this is off. Do NOT restore `if: always()`
    # (that was the original value) — removed the same pattern from
    # accessibility-tests/visual-tests 2026-08-12 after verifying live that
    # it ignores workflow cancellation; default success()-gating is correct
    # here for the same reason.
    if: false
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        continue-on-error: true
        run: |
          pytest tests/e2e/ \
            -n 2 \
            -v \
            --tb=short \
            --json-report \
            --json-report-file=reports/e2e_shard_${{ matrix.shard }}.json \
            --html=reports/e2e_report_shard_${{ matrix.shard }}.html \
            --self-contained-html \
            -m e2e \
            --reruns 2 \
            --reruns-delay 3 \
            --splits 3 \
            --group ${{ matrix.shard }}

      - name: Upload E2E shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            reports/e2e_report_shard_${{ matrix.shard }}.html
            reports/e2e_shard_${{ matrix.shard }}.json
            screenshots/
          retention-days: 30

  # ────────────────────────────────────────────── Accessibility tests
  accessibility-tests:
    name: Accessibility Tests (axe)
    runs-on: ubuntu-latest
    needs: [lint, api-tests, changes]
    # Path-filtered 2026-08-14 — brings back an explicit `if:` (removed
    # 2026-08-12 when bare always() was found to ignore cancellation; see
    # api-tests' comment above for why always()+!cancelled() is safe where
    # bare always() wasn't). needs.lint.result is checked directly (not just
    # inferred via api-tests) because a skipped api-tests is ambiguous by
    # itself — it means EITHER "path filter didn't match" (fine) OR "lint
    # failed upstream and this cascaded" (must NOT run). Only a direct,
    # unfiltered check against lint disambiguates that.
    if: |
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      (needs.api-tests.result == 'success' || needs.api-tests.result == 'skipped') &&
      (needs.changes.result != 'success' || needs.changes.outputs.accessibility == 'true')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run accessibility tests
        continue-on-error: true
        run: |
          pytest tests/accessibility/ \
            -v \
            --tb=short \
            --html=reports/a11y_report.html \
            --self-contained-html \
            --json-report-file=reports/accessibility.json \
            -m accessibility

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            reports/a11y_report.html
            reports/accessibility.json
            reports/accessibility_report.json
            reports/accessibility_login_report.json
          retention-days: 30

  # ────────────────────────────────────────────── Visual regression tests
  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [lint, accessibility-tests, changes]
    # Path-filtered 2026-08-14 — same pattern as accessibility-tests above.
    if: |
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      (needs.accessibility-tests.result == 'success' || needs.accessibility-tests.result == 'skipped') &&
      (needs.changes.result != 'success' || needs.changes.outputs.visual == 'true')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # Restore cached baselines so we compare against a known good state.
      #
      # The `v2-` generation prefix deliberately orphans every cache written
      # before 2026-08-12. Those caches hold the poisoned baselines documented in
      # docs/visual_diffs.md (a 404, stuck "Loading …" curtains, and four copies
      # of the logged-out homepage). Without the bump, editing tests/visual/**
      # changes the primary key but `restore-keys` still falls back to the newest
      # old cache — so CI would restore the poisoned generation and diff correct
      # captures against it. Bump this again if baselines ever need a clean slate.
      - name: Restore visual baselines cache
        uses: actions/cache@v5
        with:
          path: snapshots/
          key: visual-baselines-v2-${{ runner.os }}-${{ hashFiles('tests/visual/**') }}
          restore-keys: |
            visual-baselines-v2-${{ runner.os }}-

      - name: Run visual regression tests
        continue-on-error: true
        run: |
          pytest tests/visual/ \
            -v \
            --tb=short \
            --html=reports/visual_report.html \
            --self-contained-html \
            --json-report-file=reports/visual.json \
            -m visual

      # Save updated baselines back to cache
      - name: Save visual baselines cache
        if: always()
        uses: actions/cache@v5
        with:
          path: snapshots/
          # Must stay in lockstep with the restore step's generation prefix above.
          key: visual-baselines-v2-${{ runner.os }}-${{ hashFiles('tests/visual/**') }}

      - name: Upload visual regression report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            reports/visual_report.html
            reports/visual.json
            screenshots/DIFF_*
            snapshots/
          retention-days: 30

  # ────────────────────────────────────────────── Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests, accessibility-tests, visual-tests]
    # Kept always() here (unlike the test jobs above) because this is the
    # reporting job, not a test job - it must still run while e2e-tests is
    # deliberately paused (if: false -> always "skipped", and default
    # success() gating treats a skipped dependency as not-satisfied, which
    # would stop this job from running at all). Paired with !cancelled() so
    # it still respects a real concurrency-group cancellation rather than
    # repeating the bug just fixed on the test jobs.
    if: always() && !cancelled()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install report dependencies
        run: pip install pytest-json-report

      # All suite reports, so the summary table can show real test counts
      # instead of job status. Each suite's pytest step is `continue-on-error`,
      # so its job result is ~always "success" no matter how many tests failed.
      - name: Download all suite reports
        uses: actions/download-artifact@v4
        with:
          path: suite-artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Download E2E shard reports
        if: needs.e2e-tests.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: shard-artifacts/
          merge-multiple: false

      - name: Merge shard JSON reports
        if: needs.e2e-tests.result != 'skipped'
        run: |
          python scripts/merge_test_reports.py \
            shard-artifacts/e2e-shard-1/reports/e2e_shard_1.json \
            shard-artifacts/e2e-shard-2/reports/e2e_shard_2.json \
            shard-artifacts/e2e-shard-3/reports/e2e_shard_3.json \
            --output reports/e2e_combined.json \
            --markdown reports/e2e_summary.md

      - name: Post E2E summary to job summary
        if: needs.e2e-tests.result != 'skipped'
        run: cat reports/e2e_summary.md >> $GITHUB_STEP_SUMMARY

      # Real per-suite test counts, read from the JSON reports rather than from
      # `needs.<job>.result`. The old table printed job status, which is
      # structurally incapable of showing a test failure here: every suite runs
      # its pytest step with `continue-on-error: true`, so the job succeeds even
      # when tests fail, and the most-read signal in the run always said
      # "success". See scripts/suite_summary.py.
      - name: Print suite results table
        run: |
          {
            echo ""
            echo "## Test results by suite"
            echo ""
            python scripts/suite_summary.py \
              "API=suite-artifacts/api.json" \
              "E2E=shard-artifacts/*/reports/e2e_shard_*.json" \
              "Accessibility=suite-artifacts/accessibility.json" \
              "Visual Regression=suite-artifacts/reports/visual.json"
            echo ""
            echo "**Platform:** ${{ env.BASE_URL }}"
            echo ""
            echo "<details><summary>Job status (plumbing, not test results)</summary>"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| API Tests | ${{ needs.api-tests.result }} |"
            echo "| E2E Tests | ${{ needs.e2e-tests.result }} |"
            echo "| Accessibility | ${{ needs.accessibility-tests.result }} |"
            echo "| Visual Regression | ${{ needs.visual-tests.result }} |"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined E2E report
        if: needs.e2e-tests.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-combined-report
          path: |
            reports/e2e_combined.json
            reports/e2e_summary.md
          retention-days: 30
